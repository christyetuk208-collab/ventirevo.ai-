<!DOCTYPE html>
<html>
<head>
  <title>Ventirevo AI - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .login-box { background: #1e293b; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; }
    h1 { text-align: center; color: #6366f1; }
    input { padding: 12px; width: 100%; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: white; box-sizing: border-box; }
  .btn { background: #6366f1; color: white; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
  .btn:hover { background: #4f46e5; }
  .btn-google { background: #DB4437; }
  .btn-apple { background: #000; }
  .password-wrap { position: relative; }
  .toggle-pass { position: absolute; right: 10px; top: 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Ventirevo AI 🚀</h1>
    <p style="text-align:center;">Welcome back</p>

    <button class="btn btn-google" onclick="netlifyIdentity.open('signup')">Continue with Google</button>
    <button class="btn btn-apple" onclick="netlifyIdentity.open('signup')">Continue with Apple</button>

    <hr style="margin: 20px 0; border-color: #333;">
    <p style="text-align:center;">Or login with Email</p>

    <input type="email" id="email" placeholder="Enter your email">
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Enter your password">
      <span class="toggle-pass" onclick="togglePass()">👁️</span>
    </div>

    <button class="btn" onclick="emailLogin()">Login</button>
    <button class="btn" style="background:#10b981;" onclick="emailSignup()">Create New Account</button>
  </div>

<script>
  function togglePass() {
    const pass = document.getElementById('password');
    pass.type = pass.type === 'password'? 'text' : 'password';
  }

  function emailLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    netlifyIdentity.login(email, password).then(user => {
      window.location.href = "chat.html";
    }).catch(err => alert("Login failed: " + err.message));
  }

  function emailSignup() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    netlifyIdentity.signup(email, password).then(user => {
      alert("Account created! Check your email to confirm.");
    }).catch(err => alert("Signup failed: " + err.message));
  }

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("login", user => {
      window.location.href = "chat.html";
    });
  }
</script>
</body>
</html>
